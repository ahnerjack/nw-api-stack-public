<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>AHNER 导航</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;min-height:100%;overflow-x:hidden}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Arial,sans-serif;text-align:center;color:#fff;background:#202532}.bg{position:fixed;inset:0;background:linear-gradient(130deg,#202532,#303a52 42%,#1a2130);z-index:-3}.bg:before{content:"";position:absolute;inset:-20%;background:radial-gradient(circle at 22% 18%,#fff3 0 2px,transparent 3px),radial-gradient(circle at 70% 25%,#ffb7cc44 0 2px,transparent 3px),radial-gradient(circle at 55% 75%,#9ddcff33 0 2px,transparent 3px);background-size:120px 120px,160px 160px,190px 190px;animation:floatbg 24s linear infinite}.bg:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at top,#ffffff20,transparent 35%),linear-gradient(#0000,#0006)}@keyframes floatbg{to{transform:translate3d(80px,80px,0)}}#sakura{position:fixed;inset:0;z-index:-1;pointer-events:none}.wrap{position:relative;z-index:2;max-width:920px;margin:0 auto;padding:46px 18px 34px}.top{margin:8px 0 28px}.brand-logo{display:inline-flex;align-items:center;gap:12px;margin-bottom:16px;padding:10px 16px;border:1px solid #ffffff30;border-radius:24px;background:#ffffff16;box-shadow:0 16px 42px #0005;backdrop-filter:blur(14px)}.mark{width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,#69d7ff,#7c6bff 55%,#7df0b8);display:grid;place-items:center;font-weight:900;font-size:23px;box-shadow:0 10px 24px #0008}.brand-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1}.brand-text span{font-size:23px;font-weight:900;letter-spacing:.12em}.brand-text em{margin-top:6px;font-style:normal;font-size:11px;letter-spacing:.24em;color:#ffffffa8}h1{font-size:34px;letter-spacing:.08em;text-shadow:0 8px 32px #0008}.sub{font-size:13px;color:#ffffffb5;margin-top:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;justify-items:center;margin-top:22px}.box{width:100%;min-height:128px;position:relative;border-radius:24px;background:#ffffff18;border:1px solid #ffffff26;box-shadow:0 14px 35px #0004;backdrop-filter:blur(12px);transition:.18s;overflow:hidden;text-decoration:none;color:#fff;padding:16px 14px 14px}.box:hover{transform:translateY(-5px);background:#ffffff25;border-color:#ffffff70}.box:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 10%,#fff3,transparent 30%);pointer-events:none}.tag{position:absolute;left:12px;top:12px;font-size:11px;border:1px solid #ffffff30;background:#00000022;border-radius:999px;padding:3px 8px;color:#ffffffe5}.ico{width:54px;height:54px;border-radius:19px;margin:18px auto 10px;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 10px 24px #0004}.home .ico{background:linear-gradient(135deg,#16bd82,#7df0b8)}.router .ico{background:linear-gradient(135deg,#2f86ff,#65d4ff)}.api .ico{background:linear-gradient(135deg,#765cff,#e476ff)}h3{font-size:17px;margin:0 0 9px}.url{font-size:11px;color:#ffffff94;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.footer{margin-top:28px;font-size:12px;color:#ffffff94}@media(max-width:720px){.wrap{padding-top:28px}h1{font-size:28px}.grid{grid-template-columns:1fr}.brand-logo{transform:scale(.92)}}
</style>
</head>
<body>
<div class="bg"></div><canvas id="sakura"></canvas>
<main class="wrap">
  <div class="top"><div class="brand-logo"><div class="mark">DH</div><div class="brand-text"><span>AHNER</span><em>NAVIGATION</em></div></div><h1>AHNER 导航</h1><div class="sub">dh.ahner.cn</div></div>
  <div class="grid">
    <a class="box home" href="http://home.ahner.cn:18081/" target="_blank"><span class="tag">凤凰城</span><div class="ico">FC</div><h3>凤凰城导航页</h3><div class="url">http://home.ahner.cn:18081/</div></a>
    <a class="box router" href="http://10.0.0.1:10086/" target="_blank"><span class="tag">软路由</span><div class="ico">RT</div><h3>软路由导航页</h3><div class="url">http://10.0.0.1:10086/</div></a>
    <a class="box api" href="https://api.example.com/" target="_blank"><span class="tag">API</span><div class="ico">API</div><h3>NW-API</h3><div class="url">https://api.example.com/</div></a>
  </div>
  <div class="footer">Hermes Nav · Aliyun</div>
</main>
<script>
const canvas=document.getElementById('sakura'),ctx=canvas.getContext('2d');let w,h,petals=[];function resize(){w=canvas.width=innerWidth;h=canvas.height=innerHeight}addEventListener('resize',resize);resize();function make(){return{x:Math.random()*w,y:Math.random()*h,r:5+Math.random()*8,s:.5+Math.random()*1.2,a:Math.random()*Math.PI*2,spin:(Math.random()-.5)*.03}}for(let i=0;i<30;i++)petals.push(make());function draw(){ctx.clearRect(0,0,w,h);for(const p of petals){p.y+=p.s;p.x+=Math.sin(p.a)*.7;p.a+=p.spin;if(p.y>h+20){p.y=-20;p.x=Math.random()*w}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle='rgba(255,190,210,.72)';ctx.beginPath();ctx.ellipse(0,0,p.r*.65,p.r,0,0,Math.PI*2);ctx.fill();ctx.restore()}requestAnimationFrame(draw)}draw();
</script>
</body></html>
